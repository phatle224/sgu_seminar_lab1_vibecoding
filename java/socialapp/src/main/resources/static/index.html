<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social App - Spring Boot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .info {
            background: #f7f7f7;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .label {
            font-weight: 600;
            color: #333;
        }
        
        .value {
            color: #667eea;
            font-weight: 500;
        }
        
        .endpoints {
            margin-top: 20px;
        }
        
        h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        
        .endpoint {
            background: #f7f7f7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .endpoint-url {
            color: #333;
            font-family: 'Courier New', monospace;
            flex: 1;
        }
        
        .test-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .test-btn:hover {
            background: #5568d3;
        }
        
        .status {
            display: inline-block;
            padding: 5px 15px;
            background: #4caf50;
            color: white;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .response {
            margin-top: 10px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            border-left: 4px solid #4caf50;
            display: none;
        }
        
        .response pre {
            margin: 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Social App</h1>
        <p class="subtitle">Spring Boot Application</p>
        
        <div class="info">
            <div class="info-item">
                <span class="label">Status:</span>
                <span class="status">● Running</span>
            </div>
            <div class="info-item">
                <span class="label">Port:</span>
                <span class="value">8080</span>
            </div>
            <div class="info-item">
                <span class="label">Framework:</span>
                <span class="value">Spring Boot 3.5.0</span>
            </div>
            <div class="info-item">
                <span class="label">Java Version:</span>
                <span class="value">25</span>
            </div>
            <div class="info-item">
                <span class="label">CORS:</span>
                <span class="value">Enabled (All Origins)</span>
            </div>
        </div>
        
        <div class="endpoints">
            <h2>Available Endpoints</h2>
            
            <div class="endpoint">
                <span class="endpoint-url">/api/hello</span>
                <button class="test-btn" onclick="testEndpoint('/api/hello', this)">Test</button>
            </div>
            <div class="response" id="response-hello"></div>
            
            <div class="endpoint">
                <span class="endpoint-url">/api/status</span>
                <button class="test-btn" onclick="testEndpoint('/api/status', this)">Test</button>
            </div>
            <div class="response" id="response-status"></div>
            
            <div class="endpoint">
                <span class="endpoint-url">/actuator/health</span>
                <button class="test-btn" onclick="testEndpoint('/actuator/health', this)">Test</button>
            </div>
            <div class="response" id="response-health"></div>
        </div>
    </div>
    
    <script>
        async function testEndpoint(url, button) {
            const responseId = 'response-' + url.split('/').pop();
            const responseDiv = document.getElementById(responseId);
            
            button.textContent = 'Loading...';
            button.disabled = true;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                responseDiv.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                responseDiv.style.display = 'block';
                
                button.textContent = 'Test Again';
            } catch (error) {
                responseDiv.innerHTML = '<pre style="color: #f44336;">Error: ' + error.message + '</pre>';
                responseDiv.style.display = 'block';
                responseDiv.style.background = '#ffebee';
                responseDiv.style.borderLeft = '4px solid #f44336';
                
                button.textContent = 'Retry';
            } finally {
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
