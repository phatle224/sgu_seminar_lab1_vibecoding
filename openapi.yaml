openapi: 3.0.1
info:
  title: Simple Social Media Application API
  description: |
    A basic Social Networking Service (SNS) API that allows users to create, retrieve, update, and delete posts; add comments; and like/unlike posts.
    
    This API-first approach ensures it can be used as a backend for web or mobile frontends.
  version: 1.0.0
  contact:
    name: Contoso Product Team
    email: tech-lead@contoso.com

servers:
  - url: http://localhost:8080/api
    description: Local development server

tags:
  - name: Posts
    description: Operations related to post management
  - name: Comments
    description: Operations related to comment management
  - name: Likes
    description: Operations related to post likes

paths:
  /posts:
    get:
      tags:
        - Posts
      summary: List all posts
      description: Retrieve all recent posts to browse what others are sharing
      operationId: listPosts
      responses:
        '200':
          description: Successfully retrieved list of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    post:
      tags:
        - Posts
      summary: Create a new post
      description: Create a new post to share content with others
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{postId}:
    get:
      tags:
        - Posts
      summary: Get a specific post
      description: Read a specific post in detail
      operationId: getPost
      parameters:
        - name: postId
          in: path
          required: true
          description: Unique identifier of the post
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    patch:
      tags:
        - Posts
      summary: Update a post
      description: Update an existing post to correct mistakes or add information
      operationId: updatePost
      parameters:
        - name: postId
          in: path
          required: true
          description: Unique identifier of the post
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      tags:
        - Posts
      summary: Delete a post
      description: Delete a post if you no longer want it shared
      operationId: deletePost
      parameters:
        - name: postId
          in: path
          required: true
          description: Unique identifier of the post
          schema:
            type: string
      responses:
        '204':
          description: Post deleted successfully
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{postId}/comments:
    get:
      tags:
        - Comments
      summary: List all comments for a post
      description: Read all the comments on a specific post
      operationId: listComments
      parameters:
        - name: postId
          in: path
          required: true
          description: Unique identifier of the post
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved list of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    post:
      tags:
        - Comments
      summary: Create a comment on a post
      description: Comment on a post to share your thoughts
      operationId: createComment
      parameters:
        - name: postId
          in: path
          required: true
          description: Unique identifier of the post
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{postId}/comments/{commentId}:
    get:
      tags:
        - Comments
      summary: Get a specific comment
      description: See a specific comment in detail
      operationId: getComment
      parameters:
        - name: postId
          in: path
          required: true
          description: Unique identifier of the post
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          description: Unique identifier of the comment
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '404':
          description: Post or comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    patch:
      tags:
        - Comments
      summary: Update a comment
      description: Correct or revise your comment
      operationId: updateComment
      parameters:
        - name: postId
          in: path
          required: true
          description: Unique identifier of the post
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          description: Unique identifier of the comment
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
      responses:
        '200':
          description: Comment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post or comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      tags:
        - Comments
      summary: Delete a comment
      description: Delete your comment if necessary
      operationId: deleteComment
      parameters:
        - name: postId
          in: path
          required: true
          description: Unique identifier of the post
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          description: Unique identifier of the comment
          schema:
            type: string
      responses:
        '204':
          description: Comment deleted successfully
        '404':
          description: Post or comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{postId}/likes:
    post:
      tags:
        - Likes
      summary: Like a post
      description: Like a post to show appreciation
      operationId: likePost
      parameters:
        - name: postId
          in: path
          required: true
          description: Unique identifier of the post
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LikeRequest'
      responses:
        '201':
          description: Post liked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResponse'
        '400':
          description: Bad request - invalid input or already liked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      tags:
        - Likes
      summary: Unlike a post
      description: Remove your like if you change your mind
      operationId: unlikePost
      parameters:
        - name: postId
          in: path
          required: true
          description: Unique identifier of the post
          schema:
            type: string
      responses:
        '204':
          description: Like removed successfully
        '404':
          description: Post not found or like doesn't exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Post:
      type: object
      required:
        - id
        - username
        - content
        - createdAt
        - updatedAt
        - likesCount
      properties:
        id:
          type: string
          description: Unique identifier for the post
          example: "post-123"
        username:
          type: string
          description: Username of the post author
          example: "john_doe"
        content:
          type: string
          description: Content of the post
          example: "Just had an amazing hiking experience!"
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the post was created
          example: "2025-05-30T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the post was last updated
          example: "2025-05-30T11:45:00Z"
        likesCount:
          type: integer
          description: Number of likes on the post
          example: 15
          minimum: 0
    
    CreatePostRequest:
      type: object
      required:
        - username
        - content
      properties:
        username:
          type: string
          description: Username of the post author
          example: "john_doe"
          minLength: 1
          maxLength: 50
        content:
          type: string
          description: Content of the post
          example: "Just had an amazing hiking experience!"
          minLength: 1
          maxLength: 1000
    
    UpdatePostRequest:
      type: object
      required:
        - username
        - content
      properties:
        username:
          type: string
          description: Username of the post author (for verification)
          example: "john_doe"
          minLength: 1
          maxLength: 50
        content:
          type: string
          description: Updated content of the post
          example: "Just had an amazing hiking experience! Update: Added photos."
          minLength: 1
          maxLength: 1000
    
    Comment:
      type: object
      required:
        - id
        - postId
        - username
        - content
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Unique identifier for the comment
          example: "comment-456"
        postId:
          type: string
          description: Identifier of the post this comment belongs to
          example: "post-123"
        username:
          type: string
          description: Username of the comment author
          example: "jane_smith"
        content:
          type: string
          description: Content of the comment
          example: "Great post! Thanks for sharing."
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the comment was created
          example: "2025-05-30T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the comment was last updated
          example: "2025-05-30T12:15:00Z"
    
    CreateCommentRequest:
      type: object
      required:
        - username
        - content
      properties:
        username:
          type: string
          description: Username of the comment author
          example: "jane_smith"
          minLength: 1
          maxLength: 50
        content:
          type: string
          description: Content of the comment
          example: "Great post! Thanks for sharing."
          minLength: 1
          maxLength: 500
    
    UpdateCommentRequest:
      type: object
      required:
        - username
        - content
      properties:
        username:
          type: string
          description: Username of the comment author (for verification)
          example: "jane_smith"
          minLength: 1
          maxLength: 50
        content:
          type: string
          description: Updated content of the comment
          example: "Great post! Thanks for sharing. Looking forward to more."
          minLength: 1
          maxLength: 500
    
    LikeRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          description: Username of the user liking the post
          example: "alice_wonder"
          minLength: 1
          maxLength: 50
    
    LikeResponse:
      type: object
      required:
        - postId
        - username
        - likesCount
      properties:
        postId:
          type: string
          description: Identifier of the liked post
          example: "post-123"
        username:
          type: string
          description: Username of the user who liked the post
          example: "alice_wonder"
        likesCount:
          type: integer
          description: Updated total number of likes on the post
          example: 16
          minimum: 0
    
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error type or code
          example: "NOT_FOUND"
        message:
          type: string
          description: Human-readable error message
          example: "The requested post was not found"
        details:
          type: object
          description: Additional error details (optional)
          additionalProperties: true
