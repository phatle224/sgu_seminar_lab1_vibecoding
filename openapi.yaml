openapi: 3.0.1
info:
  title: Simple Social Media API
  description: A basic Social Networking Service API that allows users to create, retrieve, update, and delete posts; add comments; and like/unlike posts.
  version: 1.0.0
  contact:
    name: Contoso Team
    email: team@contoso.com

servers:
  - url: http://localhost:8080/api
    description: Local development server

paths:
  /posts:
    get:
      summary: List all posts
      description: Retrieve all recent posts for browsing
      operationId: listPosts
      responses:
        '200':
          description: Successfully retrieved posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create a new post
      description: Create a new post to share with others
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{postId}:
    get:
      summary: Get a specific post
      description: Retrieve a specific post by its ID
      operationId: getPost
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the post to retrieve
      responses:
        '200':
          description: Successfully retrieved post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update a post
      description: Update an existing post content or details
      operationId: updatePost
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the post to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a post
      description: Delete a specific post
      operationId: deletePost
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the post to delete
      responses:
        '204':
          description: Post deleted successfully
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{postId}/comments:
    get:
      summary: List comments for a post
      description: Retrieve all comments for a specific post
      operationId: listComments
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the post to get comments for
      responses:
        '200':
          description: Successfully retrieved comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create a comment
      description: Add a comment to a specific post
      operationId: createComment
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the post to comment on
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{postId}/comments/{commentId}:
    get:
      summary: Get a specific comment
      description: Retrieve a specific comment by its ID
      operationId: getComment
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the post
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the comment to retrieve
      responses:
        '200':
          description: Successfully retrieved comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '404':
          description: Post or comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update a comment
      description: Update an existing comment
      operationId: updateComment
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the post
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the comment to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
      responses:
        '200':
          description: Comment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post or comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a comment
      description: Delete a specific comment
      operationId: deleteComment
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the post
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the comment to delete
      responses:
        '204':
          description: Comment deleted successfully
        '404':
          description: Post or comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{postId}/likes:
    post:
      summary: Like a post
      description: Add a like to a specific post
      operationId: likePost
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the post to like
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LikeRequest'
      responses:
        '201':
          description: Post liked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Like'
        '400':
          description: Bad request - invalid input or already liked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Unlike a post
      description: Remove a like from a specific post
      operationId: unlikePost
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the post to unlike
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Username of the user unliking the post
              required:
                - username
      responses:
        '204':
          description: Post unliked successfully
        '400':
          description: Bad request - not currently liked by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Post:
      type: object
      required:
        - id
        - username
        - content
        - created_at
        - updated_at
        - like_count
        - comment_count
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the post
          example: 1
        username:
          type: string
          description: Username of the post author
          example: "john_doe"
        content:
          type: string
          description: Content of the post
          example: "Just had an amazing hiking experience!"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the post was created
          example: "2025-05-30T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the post was last updated
          example: "2025-05-30T10:30:00Z"
        like_count:
          type: integer
          description: Number of likes on the post
          example: 5
        comment_count:
          type: integer
          description: Number of comments on the post
          example: 2

    Comment:
      type: object
      required:
        - id
        - post_id
        - username
        - content
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the comment
          example: 1
        post_id:
          type: integer
          format: int64
          description: ID of the post this comment belongs to
          example: 1
        username:
          type: string
          description: Username of the comment author
          example: "jane_smith"
        content:
          type: string
          description: Content of the comment
          example: "Great photo! Where was this taken?"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the comment was created
          example: "2025-05-30T10:45:00Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the comment was last updated
          example: "2025-05-30T10:45:00Z"

    Like:
      type: object
      required:
        - id
        - post_id
        - username
        - created_at
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the like
          example: 1
        post_id:
          type: integer
          format: int64
          description: ID of the post that was liked
          example: 1
        username:
          type: string
          description: Username of the user who liked the post
          example: "alice_wonderland"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the like was created
          example: "2025-05-30T10:50:00Z"

    CreatePostRequest:
      type: object
      required:
        - username
        - content
      properties:
        username:
          type: string
          description: Username of the post author
          example: "john_doe"
        content:
          type: string
          description: Content of the post
          example: "Just had an amazing hiking experience!"

    UpdatePostRequest:
      type: object
      required:
        - username
        - content
      properties:
        username:
          type: string
          description: Username of the post author (for validation)
          example: "john_doe"
        content:
          type: string
          description: Updated content of the post
          example: "Just had an amazing hiking experience! The view was breathtaking."

    CreateCommentRequest:
      type: object
      required:
        - username
        - content
      properties:
        username:
          type: string
          description: Username of the comment author
          example: "jane_smith"
        content:
          type: string
          description: Content of the comment
          example: "Great photo! Where was this taken?"

    UpdateCommentRequest:
      type: object
      required:
        - username
        - content
      properties:
        username:
          type: string
          description: Username of the comment author (for validation)
          example: "jane_smith"
        content:
          type: string
          description: Updated content of the comment
          example: "Great photo! Where was this taken? Was it in Yosemite?"

    LikeRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          description: Username of the user liking the post
          example: "alice_wonderland"

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error type or code
          example: "ValidationError"
        message:
          type: string
          description: Human-readable error message
          example: "Required field 'username' is missing"
        details:
          type: object
          description: Additional error details
          additionalProperties: true